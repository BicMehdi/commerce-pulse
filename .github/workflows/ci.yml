name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PORT: 18090
    steps:
      - uses: actions/checkout@v4
      - name: Start PHP and MySQL
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: PHP syntax and business rules
        run: |
          docker compose exec -T app sh -c 'find app bin public views tests -name "*.php" -exec php -l {} \;'
          docker compose exec -T db sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE commerce_pulse_test; GRANT ALL ON commerce_pulse_test.* TO '\''pulse'\''@'\''%'\'';"'
          docker compose exec -T -e APP_ENV=testing -e DB_DATABASE=commerce_pulse_test app php bin/migrate.php
          docker compose exec -T -e APP_ENV=testing -e DB_DATABASE=commerce_pulse_test app php tests/run.php --database
      - name: Python data quality
        run: docker compose exec -T app python3 -m unittest discover -s analytics -p 'test_*.py' -v
      - name: HTTP customer and admin flows
        run: python3 tests/http_smoke.py --base-url http://127.0.0.1:18090
      - name: JavaScript syntax
        run: node --check public/assets/app.js
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop services
        if: always()
        run: docker compose down
